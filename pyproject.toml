[tool.poetry]
name = "spatialconverterui"
version = "0.1.0"
description = "Drag-and-drop macOS GUI for queueing 2D-to-spatial video conversions"
authors = ["Matt Harrington <matt2harrington@gmail.com>"]
readme = "README.md"
packages = [{ include = "spatialconverterui" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
PySide6 = "^6.6"

[tool.poetry.scripts]
spatialconverterui = "spatialconverterui.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
